[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2podcast"
version = "0.1.0"
description = "Turn documents into a podcast conversation and an MP3 with any OpenAI-compatible chat and speech server"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hamid Mergan" }]
keywords = ["podcast", "tts", "text-to-speech", "dialogue", "script", "mp3", "openai", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.30",
    "doc2speech>=0.1",
    "pydantic>=2.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-pptx>=0.6.21",
]

[project.optional-dependencies]
ui = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
test = ["pytest>=7", "httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
dev = ["pytest>=7", "httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6", "build", "twine"]

[project.urls]
Homepage = "https://github.com/hamidmergan/doc2podcast"
Source = "https://github.com/hamidmergan/doc2podcast"
Issues = "https://github.com/hamidmergan/doc2podcast/issues"
Changelog = "https://github.com/hamidmergan/doc2podcast/blob/main/CHANGELOG.md"

[project.scripts]
doc2podcast = "doc2podcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc2podcast = ["py.typed", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
